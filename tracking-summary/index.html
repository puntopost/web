---
layout: default
scripts_after: |
    <script src="/assets/js/tracking-summary.js"></script>
---

    <header class="bg-primary-subtle p-lg-3">
        <div class="bg-primary rounded-4">
            {% include nav.html %}
            <section class="text-white text-center rounded-bottom-4 pb-3">
                <h2 class="fw-bold display-5 mb-3">Estado del pedido</h2>
            </section>
        </div>
    </header>

    <main class="d-flex justify-content-center">
        <section class="px-3 mt-3" style="max-width: 600px;">
            <div id="tracking-error-alert" class="d-none">
                <div class="alert alert-danger d-flex align-items-center gap-3" role="alert">
                    <span class="bi bi-exclamation-triangle"></span>
                    <div>
                        No se ha encontrado ningún pedido con el código de seguimiento proporcionado.
                    </div>
                </div>
                <div class="text-center">
                    <a href="/" class="btn btn-link text-decoration-none fw-bold text-primary">Volver</a>
                </div>
            </div>
            <div id="tracking-summary-container" class="container border rounded-3 mb-5 d-none">
                <div class="row bg-light border-bottom">
                    <div class="col-12 p-3">
                        <span class="badge rounded-pill fw-normal mb-3 d-none text-bg-success js-status-badge-delivered">ENTREGADO</span>
                        <span class="badge rounded-pill fw-normal mb-3 d-none text-bg-warning js-status-badge-incidence">INCIDENCIA</span>
                        <span class="badge rounded-pill fw-normal mb-3 d-none text-bg-danger js-status-badge-cancelled">CANCELADO</span>
                        <div>
                            <span class="text-dark-emphasis">Tracking</span> <span class="js-tracking-id"></span>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="p-3 fw-bold">Historial de estados</div>
                        <div class="d-flex border-bottom py-2 gap-2 fs-7">
                            <img src="/assets/img/Circle_check_ON.svg" height="28" width="28" class="align-self-center">
                            <div>
                                <div class="fw-bold js-current-status"></div>
                                <div class="text-dark-emphasis js-current-status-time"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="status-history collapse">
                    <template id="status-history-tmpl">
                        <div class="d-flex border-bottom py-2 gap-2 fs-7">
                            <img src="/assets/img/Circle_check.svg" height="28" width="28" class="align-self-center">
                            <div>
                                <div class="fw-bold js-current-status"></div>
                                <div class="text-dark-emphasis js-current-status-time"></div>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="text-center">
                    <button class="btn btn-link text-decoration-none fw-bold text-primary" type="button" data-bs-toggle="collapse" data-bs-target=".status-history">Ver más</button>
                </div>
                <div class="row">
                    <div class="col-12 d-flex flex-column gap-2 p-3">
                        <b>Destino</b>
                        <div class="text-dark-emphasis fs-7 mt-2">
                            <b>Nombre</b>: <span class="js-name"></span>
                        </div>
                        <div class="text-dark-emphasis fs-7">
                            <b>Dirección</b>: <span class="js-address"></span>
                        </div>
                        <div class="text-dark-emphasis fs-7">
                            <b>Horario</b>: <span class="js-schedule"></span>
                        </div>
                        <a href="#" class="js-map-link d-none btn btn-outline-primary btn-sm mt-2 align-self-start">
                            <span class="bi bi-geo-alt-fill me-1"></span>Ver en el mapa
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>
