<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PuntoPost - Compra online, recoge aquí</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="../bootstrap.min.css" rel="stylesheet">
    <link href="../bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA==" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
    <style>
        .leaflet-container {
            font-family: inherit;
        }
        #find-pudos-input {
            letter-spacing: .3em;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header class="bg-primary-subtle">
        <div class="bg-primary">
            <nav class="navbar navbar-dark p-0">
                <div class="container-fluid">
                    <a class="navbar-brand p-0" href="/">
                        <img src="/img/logo-puntopost-amarillo.png" alt="PuntoPost Logo" style="height: 52px;">
                    </a>
                    
                    <div class="d-none d-lg-flex gap-5 align-items-center">
                        <a href="/integrations" class="nav-link text-white fw-bold fs-5">Integraciones</a>
                        <a href="/map" class="nav-link text-white fw-bold fs-5">Mapa de puntos</a>
                        <a href="/atrae" class="nav-link text-white fw-bold fs-5">Quiero ser punto</a>
                        <a href="/envia" class="btn rounded-pill fw-bold fs-5 px-4 py-2 text-dark border-0" style="background-color: #FFE135;">Envía con PuntoPost</a>
                    </div>
                    
                    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <img src="/img/puntopost2.svg" alt="PuntoPost" class="offcanvas-title" id="offcanvasNavbarLabel" style="height: 36px;">
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body p-0">
                            <div class="px-3 py-4">
                                <a href="/integrations" class="nav-link text-dark fs-5 py-3 d-block text-decoration-none fw-bold">Integraciones</a>
                                <hr class="my-0">
                                <a href="/map" class="nav-link text-dark fs-5 py-3 d-block text-decoration-none fw-bold">Mapa de puntos</a>
                                <hr class="my-0">
                                <a href="/atrae" class="nav-link text-dark fs-5 py-3 d-block text-decoration-none fw-bold">Quiero ser punto</a>
                                <hr class="my-0">
                                <a href="/envia" class="btn rounded-pill fw-bold fs-5 px-4 py-2 text-dark border-0 d-block text-center text-decoration-none mt-2" style="background-color: #FFE135;">Envía con PuntoPost</a>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
            <section class="text-white text-center rounded-bottom-4 pb-3 pb-lg-0">
                <h2 class="fw-bold fs-3 mb-3 mb-lg-0 mt-lg-0 mt-4">Encuentra tu Puntopost</h2>
                <div class="container-fluid">
                    <div class="row justify-content-center">
                        <div class="col-md-6 col-xl-5 col-xxl-4">
                            <div class="input-group input-group-sm my-lg-3">
                                <input type="text" id="find-pudos-input" class="form-control form-control-lg p-2" inputmode="numeric" placeholder="Código postal">
                                <button class="btn btn-light js-geolocate" type="button"><i class="bi bi-crosshair"></i></button>
                                <button class="btn btn-light js-find-pudos" type="button"><i class="bi bi-search"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>            
        </div>
    </header>

    <main>
        <section>
            <div id="map" class="position-absolute top-0 start-0 bottom-0 end-0 z-n1"></div>
            <div id="map-loading" class="position-absolute top-50 start-50 translate-middle d-none">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Cargando puntos...</span>
                </div>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/imask"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../toast.js"></script>
    <script src="../map.js"></script>
</body>
</html>
