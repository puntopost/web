<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 100" role="img" aria-label="PlanetaEnvíos">
  <title>PlanetaEnvíos</title>
  <!-- Outer black circle -->
  <circle cx="50" cy="50" r="48" fill="#000"/>
  <!-- White flat-top hexagon (solid white, creates the frame) -->
  <polygon points="31.5,18 68.5,18 87,50 68.5,82 31.5,82 13,50" fill="#fff"/>
  <!-- Circular-arrow "e" icon (annular arc 270° CW, from 3 o'clock to 12 o'clock) -->
  <!-- Outer r=21, inner r=12, center (50,52) -->
  <path d="M 71,52 A 21,21 0 1 1 50,31 L 50,40 A 12,12 0 1 0 62,52 Z" fill="#000"/>
  <!-- Arrowhead at 12 o'clock, pointing right (clockwise direction) -->
  <polygon points="57,31 49,25 49,37" fill="#000"/>
  <!-- Crossbar — middle bar of the "e" -->
  <rect x="28" y="47" width="42" height="9" fill="#000"/>
  <!-- Wordmark -->
  <text x="115" y="74"
        font-family="Nunito,'Arial Rounded MT Bold',Arial,sans-serif"
        font-size="67"
        font-weight="800"
        fill="#000">planetaenv&#237;os</text>
</svg>
