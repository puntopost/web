<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuntoPost - Compra online, recoge aquí</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <link href="../bootstrap.min.css" rel="stylesheet">
    <link href="../bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

    <header class="bg-primary-subtle p-lg-3">
        <div class="bg-primary rounded-4">
            <nav class="navbar navbar-dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="https://www.puntopost.mx/">
                        <img src="https://www.puntopost.mx/img/logo-puntopost-amarillo.png" alt="PuntoPost Logo" style="height: 52px;">
                    </a>
                    
                    <div class="d-none d-lg-flex gap-5 align-items-center">
                        <a href="https://www.puntopost.mx/map" class="nav-link text-white fw-bold fs-5">Mapa de puntos</a>
                        <a href="https://www.puntopost.mx/atrae" class="nav-link text-white fw-bold fs-5">Quiero ser punto</a>
                        <a href="https://www.puntopost.mx/envia" class="btn rounded-pill fw-bold fs-5 px-4 py-2 text-dark border-0" style="background-color: #FFE135;">Envía con PuntoPost</a>
                    </div>
                    
                    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <img src="https://www.puntopost.mx/img/puntopost2.svg" alt="PuntoPost" class="offcanvas-title" id="offcanvasNavbarLabel" style="height: 30px;">
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body p-0">
                            <div class="px-3 py-4">
                                <a href="https://www.puntopost.mx/map" class="nav-link text-dark fs-5 py-3 d-block text-decoration-none fw-bold">Mapa de puntos</a>
                                <hr class="my-0">
                                <a href="https://www.puntopost.mx/atrae" class="nav-link text-dark fs-5 py-3 d-block text-decoration-none fw-bold">Quiero ser punto</a>
                                <hr class="my-0">
                                <a href="https://www.puntopost.mx/envia" class="btn rounded-pill fw-bold fs-5 px-4 py-2 text-dark border-0 d-block text-center text-decoration-none mt-2" style="background-color: #FFE135;">Envía con PuntoPost</a>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>         
        </div>
    </header>

    <main>
        <section class="bg-body-secondary">
            <div class="container pt-2 pb-4 pt-lg-4 pb-lg-5">
                <h2 class="text-center my-5 fs-3 fw-bold">Términos y condiciones</h2>
                <!-- Contenido original de términos y condiciones aquí -->
            </div>
        </section>
    </main>

    <footer class="bg-primary text-white text-center rounded-bottom-4 py-4">
        <div class="container">
            <div class="d-flex flex-column justify-content-center align-items-center gap-2">
                <img src="https://www.puntopost.mx/img/logo-isotipo-verde 2.svg" alt="Pin" height="40">
                <a href="https://www.puntopost.mx/condiciones" class="text-white fs-7 fw-bold link-underline link-underline-opacity-0">Términos y Condiciones</a>
                <a href="https://www.puntopost.mx/privacidad" class="text-white fs-7 fw-bold link-underline link-underline-opacity-0">Política de privacidad</a>
                <b class="text-white fs-7">© PuntoPost</b>
            </div>
        </div>
    </footer>
</body>
</html>
